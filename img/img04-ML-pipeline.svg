<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="520" fill="white"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="40" rx="8" fill="#f1f3f4"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#202124">Концепція ML Pipeline</text>

  <!-- ── BLOCK 1: Pipeline.fit() ── -->
  <text x="16" y="68" font-size="12" fill="#374151">Pipeline.fit() — навчання:</text>

  <!-- Raw -->
  <rect x="16" y="76" width="80" height="52" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="56" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Raw</text>
  <text x="56" y="116" text-anchor="middle" font-size="11" fill="#6b7280">text+label</text>
  <!-- arrow -->
  <line x1="96" y1="102" x2="116" y2="102" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tokenizer -->
  <rect x="118" y="76" width="120" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="178" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">Tokenizer</text>
  <text x="178" y="116" text-anchor="middle" font-size="11" fill="#0d9488">Transformer</text>

  <!-- df1 -->
  <rect x="242" y="88" width="32" height="24" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="258" y="104" text-anchor="middle" font-size="10" fill="#6b7280">df1</text>
  <!-- arrow -->
  <line x1="274" y1="102" x2="294" y2="102" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- HashingTF -->
  <rect x="296" y="76" width="120" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="356" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">HashingTF</text>
  <text x="356" y="116" text-anchor="middle" font-size="11" fill="#0d9488">Transformer</text>

  <!-- df2 -->
  <rect x="420" y="88" width="32" height="24" rx="4" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="436" y="104" text-anchor="middle" font-size="10" fill="#6b7280">df2</text>
  <!-- arrow -->
  <line x1="452" y1="102" x2="472" y2="102" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LogisticReg -->
  <rect x="474" y="70" width="140" height="64" rx="8" fill="#fff5f5" stroke="#e53935" stroke-width="1.5"/>
  <text x="544" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">LogisticReg</text>
  <text x="544" y="112" text-anchor="middle" font-size="11" fill="#e53935">Estimator</text>
  <text x="544" y="126" text-anchor="middle" font-size="11" fill="#e53935">.fit() → Model</text>

  <!-- ── BLOCK 2: PipelineModel ── -->
  <text x="16" y="168" font-size="12" fill="#374151">Результат Pipeline.fit() → PipelineModel (Transformer):</text>
  <rect x="16" y="176" width="860" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="446" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">PipelineModel</text>
  <text x="446" y="216" text-anchor="middle" font-size="12" fill="#7c3aed">Tokenizer + HashingTF + LogisticRegressionModel → .transform()</text>

  <!-- ── BLOCK 3: Inference ── -->
  <text x="16" y="258" font-size="12" fill="#374151">PipelineModel.transform() — inference (тестові дані):</text>

  <!-- Test -->
  <rect x="16" y="266" width="80" height="52" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="56" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Test</text>
  <text x="56" y="306" text-anchor="middle" font-size="11" fill="#6b7280">raw text</text>
  <line x1="96" y1="292" x2="116" y2="292" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Tokenizer inference -->
  <rect x="118" y="266" width="120" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="178" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">Tokenizer</text>
  <text x="178" y="306" text-anchor="middle" font-size="11" fill="#0d9488">→ words</text>
  <line x1="238" y1="292" x2="258" y2="292" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- HashingTF inference -->
  <rect x="260" y="266" width="120" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="320" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">HashingTF</text>
  <text x="320" y="306" text-anchor="middle" font-size="11" fill="#0d9488">→ vectors</text>
  <line x1="380" y1="292" x2="400" y2="292" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LR Model -->
  <rect x="402" y="266" width="120" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="462" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">LR Model</text>
  <text x="462" y="306" text-anchor="middle" font-size="11" fill="#16a34a">→ predictions</text>

  <!-- ── BLOCK 4: DAG ── -->
  <text x="446" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Архітектура: Directed Acyclic Graph (DAG)</text>
  <text x="446" y="374" text-anchor="middle" font-size="12" fill="#6b7280">Зв'язки між етапами — через назви стовпців (inputCol / outputCol)</text>

  <!-- 3 tag boxes -->
  <rect x="40" y="386" width="240" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="409" text-anchor="middle" font-size="12" fill="#92400e">Топологічний порядок — обов'язковий</text>

  <rect x="300" y="386" width="200" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="409" text-anchor="middle" font-size="12" fill="#15803d">Runtime type-checking схеми</text>

  <rect x="520" y="386" width="220" height="36" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="630" y="409" text-anchor="middle" font-size="12" fill="#0f766e">Unique ID для кожного stage</text>

  <!-- ── BLOCK 5: Data Leakage ── -->
  <rect x="16" y="440" width="860" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="36" y="464" font-size="12" font-weight="bold" fill="#374151">⚠ Data Leakage:</text>
  <text x="36" y="482" font-size="12" fill="#374151">статистики нормалізації (mean, std) мають обчислюватись лише на train-даних через Pipeline.fit(), а не на всьому датасеті!</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

</svg>
