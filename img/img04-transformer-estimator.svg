<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="Arial, sans-serif">

  <rect width="860" height="440" fill="white"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="860" height="40" rx="8" fill="#f1f3f4"/>
  <text x="16" y="26" font-size="15" font-weight="bold" fill="#202124">Transformer та Estimator</text>

  <!-- ── TRANSFORMER card ── -->
  <text x="180" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Transformer</text>
  <rect x="50" y="78" width="260" height="54" rx="10" fill="#b2dfdb" stroke="#00897b" stroke-width="2"/>
  <text x="180" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#004d40" font-family="monospace">.transform(df)</text>
  <text x="180" y="121" text-anchor="middle" font-size="13" fill="#00695c">DataFrame → DataFrame</text>

  <!-- Transformer examples -->
  <text x="50" y="152" font-size="12" fill="#5f6368">Приклади:</text>
  <rect x="50"  y="158" width="76"  height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="88"  y="174" text-anchor="middle" font-size="11" fill="#374151">Tokenizer</text>
  <rect x="132" y="158" width="106" height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="185" y="174" text-anchor="middle" font-size="11" fill="#374151">VectorAssembler</text>
  <rect x="50"  y="188" width="68"  height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="84"  y="204" text-anchor="middle" font-size="11" fill="#374151">HashingTF</text>
  <rect x="124" y="188" width="130" height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="189" y="204" text-anchor="middle" font-size="11" fill="#374151">LogRegModel (навч.)</text>

  <!-- Divider -->
  <line x1="430" y1="50" x2="430" y2="220" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ── ESTIMATOR card ── -->
  <text x="650" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#202124">Estimator</text>
  <rect x="510" y="78" width="260" height="54" rx="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="640" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#b71c1c" font-family="monospace">.fit(df)</text>
  <text x="640" y="121" text-anchor="middle" font-size="13" fill="#c62828">DataFrame → Model</text>

  <!-- Estimator examples -->
  <text x="510" y="152" font-size="12" fill="#5f6368">Приклади:</text>
  <rect x="510" y="158" width="126" height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="573" y="174" text-anchor="middle" font-size="11" fill="#374151">LogisticRegression</text>
  <rect x="642" y="158" width="100" height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="692" y="174" text-anchor="middle" font-size="11" fill="#374151">RandomForest</text>
  <rect x="510" y="188" width="62"  height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="541" y="204" text-anchor="middle" font-size="11" fill="#374151">Pipeline</text>
  <rect x="578" y="188" width="66"  height="24" rx="6" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="611" y="204" text-anchor="middle" font-size="11" fill="#374151">k-Means</text>

  <!-- ── LIFECYCLE ── -->
  <text x="430" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">Lifecycle</text>

  <!-- Estimator -->
  <rect x="80" y="268" width="150" height="56" rx="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="155" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">Estimator</text>
  <text x="155" y="312" text-anchor="middle" font-size="11" fill="#c62828">(алгоритм)</text>

  <!-- arrow .fit() -->
  <text x="270" y="289" text-anchor="middle" font-size="10" font-family="monospace" fill="#888">.fit()</text>
  <line x1="232" y1="296" x2="308" y2="296" stroke="#aaa" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Model -->
  <rect x="310" y="268" width="160" height="56" rx="10" fill="#b2dfdb" stroke="#00897b" stroke-width="2"/>
  <text x="390" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#004d40">Model</text>
  <text x="390" y="312" text-anchor="middle" font-size="11" fill="#00695c">(Transformer)</text>

  <!-- arrow .transform() -->
  <text x="510" y="289" text-anchor="middle" font-size="10" font-family="monospace" fill="#888">.transform()</text>
  <line x1="472" y1="296" x2="548" y2="296" stroke="#aaa" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Predictions -->
  <rect x="550" y="268" width="160" height="56" rx="10" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="630" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">Predictions</text>
  <text x="630" y="312" text-anchor="middle" font-size="11" fill="#2e7d32">новий DataFrame</text>


  <!-- ── PROPERTIES ── -->
  <rect x="30"  y="378" width="380" height="50" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50"  y="398" font-size="12" font-weight="bold" fill="#374151">Stateless</text>
  <text x="50"  y="416" font-size="11" fill="#6b7280">.transform() та .fit() генерують нові структури даних</text>

  <rect x="450" y="378" width="380" height="50" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="470" y="398" font-size="12" font-weight="bold" fill="#374151">Unique ID</text>
  <text x="470" y="416" font-size="11" fill="#6b7280">Кожен екземпляр має власний ID</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

</svg>
